# Self-harm and suicidal-ideation lexicon.
# STATUS: draft-unreviewed. A clinician must review this list before any pilot use (docs/intended-purpose.md).
# See emergency.yaml for the meaning of `terms` and `condition_terms`. Indirect phrasings ("better off without
# me", "sleep and never wake up") are included on purpose: recall matters more than precision.
version: draft-unreviewed
kind: self_harm
review:
  status: draft-unreviewed
  reviewed_by: null
  reviewed_on: null
  note: "Draft written by the engineering track. Requires clinician and native-speaker review."
# A past attempt or past self-harm still shows the crisis resources (recall first).
suppress_historical: false
# Threats from someone else are abuse disclosures, not self-harm.
exclusions:
  - menace de me tuer
  - menacé de me tuer
  - menacée de me tuer
  - threatens to kill me
  - threatened to kill me
  # routine medication intake is not an overdose
  - all my pills this morning
  - all my pills in the morning
  - all my pills as prescribed
  - all my tablets this morning
  - all my tablets in the morning
  - all my tablets as prescribed
  - all my meds this morning
  - all my meds in the morning
  - all my medication this morning
  - all my medication as prescribed
  - all her tablets in the morning
  - all his tablets in the morning
  - all her pills in the morning
  - all his pills in the morning
  - tous mes médicaments le matin
  - tous mes comprimés le matin
  - toutes mes pilules le matin
  # Talking ABOUT the topic or its prevention is not a disclosure (a disclosure elsewhere in the message still hits).
  - suicide prevention
  - prevention of suicide
  - topic of suicide
  - subject of suicide
  - topic of self harm
  - subject of self harm
  - prévention du suicide
  - sujet de l'automutilation
  - sujet du suicide
  - الوقاية من الانتحار
  - موضوع الانتحار
  - موضوع إيذاء النفس
