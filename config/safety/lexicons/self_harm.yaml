# Co-occurrence entries (app/guardrails/lexicon_combos.py; see emergency.yaml). Judged like condition terms, so a
# purely informational question without a personal cue does not trigger them: method questions are terms above.
# Added from failures of the `tune` split of evals/safety/sets (the held-out split is never inspected).
combinations:
  en:
    - [["bridge", "roof", "ledge", "balcony", "cliff", "window", "building", "tower", "platform", "tracks"], ["jump", "jumping", "throw myself", "going over", "step off"]]
    - [["feel like", "want*", "urge", "urges", "thinking", "thought*", "going to", "gonna", "keep", "cant stop"], ["hurting myself", "hurt myself", "harm myself", "harming myself", "kill myself", "killing myself", "cut myself", "cutting myself", "burn myself", "end my life"]]
    - [["pills", "tablets", "meds", "medication", "insulin", "sleeping pills", "painkillers"], ["saved", "saving", "stockpil*", "hoard*", "collected", "take them all", "all at once", "all tonight", "to die", "end it"]]
