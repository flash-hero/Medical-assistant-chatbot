# Context cues used by the lexicon matcher (app/guardrails/lexicon.py).
# STATUS: draft-unreviewed. A clinician and a native speaker of each language must review before pilot use.
#
# All cues are normalised with core.text.detection_form before use (lowercase, accents stripped, Arabic letters
# folded, punctuation removed), so write them naturally.
#   negation:      a hit is ignored when one of these tokens/phrases ends within `negation_window` tokens BEFORE it
#   historical:    a hit is ignored when the same clause talks about the past / an old diagnosis
#   informational: a hit is ignored when the clause is a general question BEFORE the hit and has no personal cue
#   personal:      first/second/third-person words that make a clause about a real person now
#   clause_breaks: words that start a new clause (punctuation already splits clauses)
version: draft-unreviewed
review:
  status: draft-unreviewed
  reviewed_by: null
  note: "Must be reviewed by a clinician and native speakers (EN, FR, MSA, Darija, Algerian, Tunisian)."
negation_window: 3
negation:
  en: ["no", "not", "don't", "dont", "doesn't", "doesnt", "didn't", "didnt", "never", "without", "isn't", "isnt",
       "wasn't", "wasnt", "haven't", "havent", "hasn't", "hasnt", "nor", "neither", "aren't", "denies", "free of",
       "no longer", "none"]
  # bare "plus" is ambiguous ("de plus en plus mal"), so only its negative constructions are listed
  fr: ["pas", "jamais", "sans", "aucun", "aucune", "ni", "nullement", "point de", "n ai plus", "n a plus",
       "n avons plus", "n est plus", "ne plus", "n y a plus"]
  ar: ["لا", "ما", "ماشي", "مش", "ليس", "ليست", "لم", "لن", "بدون", "بلا", "ماعنديش", "معنديش", "ما عنديش",
