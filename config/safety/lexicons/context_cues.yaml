  arabizi: ["ma", "mach", "machi", "mashi", "mich", "mouch", "ma3andich", "ma3ndich", "m3ndich", "makaynch",
            "makaynche", "mafamech", "mafamach", "bla", "bidoun", "la"]
# Phrases that start with a negation word but do not negate ("ما زال" = still, "pas mal de" = quite a lot).
negation_exceptions:
  en: ["not only", "no doubt", "never mind"]
  fr: ["pas mal de", "pas que", "pas seulement"]
  ar: ["ما زال", "ما زلت", "ما زالت", "ما زالو", "لا زال", "لا زلت", "لا زالت", "ما عرفت", "ما عرفتش"]
  arabizi: ["ma zal", "ma zalt", "mazal", "mazalt"]
