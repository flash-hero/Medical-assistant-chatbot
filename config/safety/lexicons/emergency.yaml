# Co-occurrence entries (app/guardrails/lexicon_combos.py): every group must match within 12 tokens, in any
# order. "word*" = prefix, "*word" = suffix. Judged like condition terms (negation, historical, informational).
# Added from failures of the `tune` split of evals/safety/sets (the held-out split is never inspected).
combinations:
  en:
    # chest pain / pressure in any word order
    - [["chest", "sternum", "breastbone"], ["pain", "pains", "hurt*", "ache*", "aching", "heavy", "heaviness", "pressure", "tight*", "crush*", "squeez*", "elephant", "band", "vice"]]
    - [["spread*", "radiat*", "going down", "down my", "into my", "up to my"], ["left arm", "jaw", "arm and jaw"]]
    # stroke signs
    - [["face", "mouth", "smile", "lip"], ["droop*", "lopsided", "crooked", "sagg*", "fell", "fallen", "uneven", "twisted"]]
    - [["slurred", "slurring", "garbled", "jumbled", "mixed up", "muddled"], ["speech", "words", "talking", "speaking", "voice"]]
    - [["cant", "cannot", "unable to", "can barely", "couldnt"], ["lift", "move", "raise", "feel", "use"], ["arm", "arms", "leg", "legs", "side", "hand", "face"]]
    - [["sudden*", "all of a sudden"], ["lost", "losing", "loss of", "went blind", "blind", "cant see", "double"], ["vision", "sight", "eye", "eyes", "eyesight", "see"]]
    # breathing
    - [["cant", "cannot", "barely", "struggl*", "gasping", "fighting", "unable to"], ["breath*", "air"]]
    - [["cant", "cannot", "unable to"], ["finish", "complete", "speak in"], ["sentence", "sentences"]]
    - [["lips", "tongue", "throat", "face", "mouth", "eyes"], ["swell*", "swollen", "puff*", "closing", "blue", "grey", "gray"]]
    - [["stung", "sting", "wasp", "bee", "peanut*", "nut", "nuts", "shellfish", "allerg*", "epipen", "epi pen"], ["wheez*", "throat", "breath*", "lips", "tongue", "dizzy", "faint*", "collaps*"]]
    - [["asthma", "inhaler", "ventolin", "puffer", "nebuliser", "nebulizer"], ["attack", "not working", "isnt working", "doesnt help", "isnt helping", "not helping", "doesnt work", "didnt work", "severe"]]
    - [["epipen", "epi pen", "adrenaline", "adrenalin"], ["not working", "still", "didnt work", "used", "again"]]
    # infants and children
    - [["baby", "newborn", "infant", "week old", "weeks old", "month old", "months old"], ["floppy", "limp", "blue", "grunting", "wont feed", "not feeding", "unresponsive", "breathing fast", "breathing very fast", "purple", "wont wake", "cant wake"]]
    # head injury, falls
    - [["hit", "banged", "bumped", "knocked", "fell on", "struck", "landed on"], ["head"], ["vomit*", "throwing up", "threw up", "confused", "drowsy", "sleepy", "unconscious", "passed out", "knocked out", "blacked out", "bleeding", "seizure", "fit", "wont wake", "sick", "being sick"]]
    - [["fell", "fallen", "fall", "jumped"], ["roof", "ladder", "balcony", "storey", "story", "window", "height", "scaffold*", "floor up", "cliff"]]
    # poisoning, overdose
    - [["drank", "drunk", "swallowed", "ate", "eaten", "ingested", "got into", "has had", "licked", "sipped"], ["bleach", "antifreeze", "poison*", "detergent", "chemical*", "drain cleaner", "cleaning product", "laundry pod", "laundry capsule", "battery", "batteries", "magnet*", "weed killer", "weedkiller", "pesticide", "rat poison", "methanol", "paraffin", "lamp oil", "white spirit", "nail polish remover", "dishwasher tablet", "washing powder", "mushrooms"]]
