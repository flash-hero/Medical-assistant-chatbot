# Emergency lexicon (possible acute medical emergency happening now).
# STATUS: draft-unreviewed. A clinician must review this list before any pilot use (docs/intended-purpose.md).
#
# Matching (app/guardrails/lexicon.py) runs on core.text.detection_form; `arabizi` entries are also folded
# (3->a, 7->h, 9->q, ...). Two kinds of entries:
#   terms            acute / first-person phrasings; ignored only when negated or clearly historical
#   condition_terms  names of conditions or symptoms; ALSO ignored inside a general informational question
#                    without any personal cue ("what are the signs of a stroke?")
# Recall matters more than precision: the router ORs this lexicon with the classifier. Ambiguous everyday words
# (food poisoning, muscle cramps, figurative "choked", heartburn) are deliberately left out.
version: draft-unreviewed
kind: emergency
review:
  status: draft-unreviewed
  reviewed_by: null
  reviewed_on: null
  note: "Draft written by the engineering track. Requires clinician and native-speaker review."
# Old episodes ("my chest pain last month was diagnosed as reflux") do not trigger the emergency template.
suppress_historical: true
# Idioms blanked out before matching (figurative uses of a term).
exclusions:
  - dying to know
  - dying to see
  - dying to try
  - dying to meet
  - dying to go
  - dying for a
  - dying of laughter
  - dying laughing
  - je meurs d'envie
  - je meurs de rire
  - mort de rire
