  title: {en: "Appointment request", fr: "Demande de rendez-vous", ar: "طلب موعد"}
  description:
    en: "Send a request to the hospital team. They will call you back to confirm. Do not use this form for emergencies."
    fr: "Envoyez une demande à l'équipe de l'hôpital. Elle vous rappellera pour confirmer. N'utilisez pas ce formulaire en cas d'urgence."
    ar: "أرسل طلبًا إلى فريق المستشفى. سيعاودون الاتصال بك للتأكيد. لا تستخدم هذا النموذج في حالات الطوارئ."
  fields:
    full_name: {en: "Full name", fr: "Nom complet", ar: "الاسم الكامل"}
    phone: {en: "Phone number", fr: "Numéro de téléphone", ar: "رقم الهاتف"}
    email: {en: "E-mail (optional)", fr: "E-mail (facultatif)", ar: "البريد الإلكتروني (اختياري)"}
    department_id: {en: "Department", fr: "Service", ar: "القسم"}
    preferred_dates: {en: "Preferred dates and times", fr: "Dates et horaires souhaités", ar: "التواريخ والأوقات المفضلة"}
    reason: {en: "Reason (optional, no medical details needed)", fr: "Motif (facultatif, sans détails médicaux)", ar: "السبب (اختياري، دون تفاصيل طبية)"}
    consent: {en: "I agree that the hospital may contact me about this request", fr: "J'accepte que l'hôpital me contacte au sujet de cette demande", ar: "أوافق على أن يتصل بي المستشفى بخصوص هذا الطلب"}
errors:
  invalid_input: {en: "Your request could not be processed. Please check it and try again.", fr: "Votre demande n'a pas pu être traitée. Vérifiez-la et réessayez.", ar: "تعذرت معالجة طلبك. يرجى التحقق منه والمحاولة مرة أخرى."}
  unauthorized: {en: "Your session has expired. Please start a new conversation.", fr: "Votre session a expiré. Veuillez commencer une nouvelle conversation.", ar: "انتهت صلاحية جلستك. يرجى بدء محادثة جديدة."}
  not_found: {en: "Not found.", fr: "Introuvable.", ar: "غير موجود."}
  rate_limited: {en: "Too many messages. Please wait a moment and try again.", fr: "Trop de messages. Patientez un instant et réessayez.", ar: "رسائل كثيرة جدًا. يرجى الانتظار قليلًا والمحاولة مرة أخرى."}
  session_exhausted: {en: "This conversation has reached its message limit. Please start a new conversation.", fr: "Cette conversation a atteint sa limite de messages. Veuillez en commencer une nouvelle.", ar: "وصلت هذه المحادثة إلى الحد الأقصى للرسائل. يرجى بدء محادثة جديدة."}
  overloaded: {en: "The assistant is very busy. Please try again in a few seconds. In an emergency, call your local emergency number.", fr: "L'assistant est très sollicité. Réessayez dans quelques secondes. En cas d'urgence, appelez le numéro d'urgence local.", ar: "المساعد مشغول جدًا. يرجى المحاولة بعد بضع ثوانٍ. في حالة الطوارئ، اتصل برقم الطوارئ المحلي."}
  service_paused: {en: "The assistant is paused for maintenance. In an emergency, call your local emergency number.", fr: "L'assistant est en pause pour maintenance. En cas d'urgence, appelez le numéro d'urgence local.", ar: "المساعد متوقف مؤقتًا للصيانة. في حالة الطوارئ، اتصل برقم الطوارئ المحلي."}
  dependency_unavailable: {en: "A service is temporarily unavailable. Please try again later.", fr: "Un service est temporairement indisponible. Réessayez plus tard.", ar: "إحدى الخدمات غير متاحة مؤقتًا. يرجى المحاولة لاحقًا."}
  turn_in_progress: {en: "Your previous message is still being answered.", fr: "Votre message précédent est encore en cours de traitement.", ar: "ما زالت رسالتك السابقة قيد المعالجة."}
  payload_too_large: {en: "Your message is too long.", fr: "Votre message est trop long.", ar: "رسالتك طويلة جدًا."}
  upstream_error: {en: "The assistant could not answer right now. Please try again.", fr: "L'assistant n'a pas pu répondre pour le moment. Réessayez.", ar: "لم يتمكن المساعد من الرد الآن. يرجى المحاولة مرة أخرى."}
  internal_error: {en: "Something went wrong. Please try again.", fr: "Une erreur s'est produite. Réessayez.", ar: "حدث خطأ ما. يرجى المحاولة مرة أخرى."}
