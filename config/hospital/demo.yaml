# FICTIONAL demo hospital profile. Validates against core.schemas.hospital.HospitalProfile.
# Every hospital fact here is invented EXCEPT the national emergency and crisis numbers for France:
#   15   SAMU (medical emergencies)
#   112  European emergency number (works from any phone in the EU)
#   3114 Numero national de prevention du suicide (24/7)
# The hospital's own lines use the obviously fictional range +33 1 00 00 00 xx.
