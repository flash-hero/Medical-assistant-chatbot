visiting_hours:
  en: "Visits are possible every day from 13:00 to 20:00. Intensive care: 2 visitors at a time. Maternity: partners at any time."
  fr: "Les visites sont possibles tous les jours de 13 h à 20 h. Réanimation : 2 visiteurs à la fois. Maternité : le partenaire à toute heure."
  ar: "الزيارات ممكنة كل يوم من 13:00 إلى 20:00. العناية المركزة: زائران في نفس الوقت. قسم الولادة: يمكن للشريك الزيارة في أي وقت."
documents_to_bring:
  en: "Bring an identity document, your Carte Vitale (health insurance card), your complementary insurance (mutuelle) card, your referral letter if you have one, your current prescriptions and recent test results."
  fr: "Apportez une pièce d'identité, votre carte Vitale, votre carte de mutuelle, votre lettre d'orientation si vous en avez une, vos ordonnances en cours et vos résultats d'examens récents."
  ar: "أحضر وثيقة هوية، وبطاقة التأمين الصحي (Carte Vitale)، وبطاقة التأمين التكميلي (mutuelle)، ورسالة الإحالة إن وجدت، ووصفاتك الطبية الحالية ونتائج فحوصاتك الأخيرة."
insurance:
  en: "The demo hospital works with the French national health insurance (Assurance Maladie) and most complementary insurers. Ask the admissions desk about costs that are not covered."
  fr: "L'hôpital de démonstration travaille avec l'Assurance Maladie et la plupart des mutuelles. Renseignez-vous au bureau des admissions pour les frais non couverts."
  ar: "يتعامل المستشفى التجريبي مع التأمين الصحي الوطني الفرنسي (Assurance Maladie) ومعظم شركات التأمين التكميلي. اسأل مكتب القبول عن التكاليف غير المغطاة."
directions:
  en: "Fictional directions: Démo metro station (line 0), exit 2, then 3 minutes on foot. Bus 000 stops at the main entrance. Visitor car park on level -1."
  fr: "Accès fictif : station de métro Démo (ligne 0), sortie 2, puis 3 minutes à pied. Le bus 000 s'arrête devant l'entrée principale. Parking visiteurs au niveau -1."
  ar: "اتجاهات وهمية: محطة مترو ديمو (الخط 0)، المخرج 2، ثم 3 دقائق سيرًا على الأقدام. تتوقف الحافلة 000 أمام المدخل الرئيسي. موقف سيارات الزوار في الطابق -1."
