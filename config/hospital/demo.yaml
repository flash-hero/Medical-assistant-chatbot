faqs:
  - id: parking
    question:
      en: "Is there parking at the hospital?"
      fr: "Y a-t-il un parking à l'hôpital ?"
      ar: "هل يوجد موقف سيارات في المستشفى؟"
    answer:
      en: "Yes. The visitor car park is on level -1 under Building A and is open 24/7. Spaces for people with reduced mobility are next to the lifts."
      fr: "Oui. Le parking visiteurs se trouve au niveau -1 sous le bâtiment A et est ouvert 24 h/24. Des places pour les personnes à mobilité réduite sont situées près des ascenseurs."
      ar: "نعم. يقع موقف سيارات الزوار في الطابق -1 تحت المبنى A وهو مفتوح على مدار الساعة. توجد أماكن مخصصة للأشخاص ذوي الحركة المحدودة بالقرب من المصاعد."
    keywords: [parking, car park, park, car, garer, voiture, stationnement, "موقف", "باركينغ", "سيارة", "parking", "tomobil"]
  - id: wifi
    question:
      en: "Is there free Wi-Fi?"
      fr: "Y a-t-il un Wi-Fi gratuit ?"
      ar: "هل يوجد واي فاي مجاني؟"
    answer:
      en: "Yes. Connect to the network named DEMO-GUEST; no password is needed."
      fr: "Oui. Connectez-vous au réseau DEMO-GUEST ; aucun mot de passe n'est nécessaire."
      ar: "نعم. اتصل بالشبكة المسماة DEMO-GUEST؛ لا حاجة إلى كلمة مرور."
    keywords: [wifi, "wi-fi", internet, "واي فاي", "الويفي", "انترنت"]
  - id: cafeteria
    question:
      en: "Where can I eat or buy a drink?"
      fr: "Où puis-je manger ou acheter une boisson ?"
      ar: "أين يمكنني الأكل أو شراء مشروب؟"
    answer:
      en: "The cafeteria is in the main hall of Building A, open every day from 7:30 to 19:00. Vending machines are available 24/7 next to the emergency department."
      fr: "La cafétéria se trouve dans le hall principal du bâtiment A, ouverte tous les jours de 7 h 30 à 19 h. Des distributeurs sont disponibles 24 h/24 à côté des urgences."
      ar: "تقع الكافتيريا في البهو الرئيسي للمبنى A، وهي مفتوحة كل يوم من 7:30 إلى 19:00. تتوفر آلات البيع على مدار الساعة بجوار قسم المستعجلات."
    keywords: [cafeteria, food, eat, drink, coffee, "cafétéria", manger, boire, "café", restaurant, "كافتيريا", "أكل", "مقهى", "قهوة", "makla"]
  - id: medical_records
    question:
      en: "How do I get a copy of my medical records?"
      fr: "Comment obtenir une copie de mon dossier médical ?"
      ar: "كيف أحصل على نسخة من ملفي الطبي؟"
    answer:
      en: "Send a written request with a copy of your identity document to the medical records office (Building A, 2nd floor) or ask at the reception desk. Records are sent within the legal time limits."
      fr: "Envoyez une demande écrite avec une copie de votre pièce d'identité au service des dossiers médicaux (bâtiment A, 2e étage) ou adressez-vous à l'accueil. Le dossier est transmis dans les délais légaux."
      ar: "أرسل طلبًا كتابيًا مع نسخة من وثيقة هويتك إلى مكتب الملفات الطبية (المبنى A، الطابق الثاني) أو اسأل في مكتب الاستقبال. يتم إرسال الملف ضمن الآجال القانونية."
    keywords: [medical records, records, file, copy, "dossier médical", dossier, copie, "ملف طبي", "الملف الطبي", "نسخة", "dossier"]
  - id: interpreter
    question:
      en: "Can I have an interpreter?"
      fr: "Puis-je avoir un interprète ?"
      ar: "هل يمكنني الحصول على مترجم؟"
    answer:
      en: "Yes. Ask the reception desk when you arrive or when you book; interpreting is available for many languages, including Arabic and French sign language."
      fr: "Oui. Demandez à l'accueil à votre arrivée ou lors de la prise de rendez-vous ; l'interprétariat est disponible dans de nombreuses langues, dont l'arabe et la langue des signes française."
      ar: "نعم. اطلب ذلك من مكتب الاستقبال عند وصولك أو عند الحجز؛ تتوفر الترجمة بلغات عديدة، منها العربية ولغة الإشارة الفرنسية."
    keywords: [interpreter, translator, translation, "interprète", interprete, traducteur, "مترجم", "ترجمة", "terjman"]
  - id: accessibility
    question:
      en: "Is the hospital accessible for wheelchairs?"
      fr: "L'hôpital est-il accessible en fauteuil roulant ?"
      ar: "هل المستشفى مجهز لاستقبال الكراسي المتحركة؟"
    answer:
      en: "Yes. All buildings have step-free access and lifts. Wheelchairs can be borrowed at the main entrance."
      fr: "Oui. Tous les bâtiments sont accessibles de plain-pied et équipés d'ascenseurs. Des fauteuils roulants peuvent être empruntés à l'entrée principale."
      ar: "نعم. جميع المباني مجهزة بمداخل بدون درج وبمصاعد. يمكن استعارة كراسي متحركة عند المدخل الرئيسي."
    keywords: [wheelchair, accessible, accessibility, disabled, "fauteuil roulant", "accessibilité", handicap, "كرسي متحرك", "إعاقة", "ولوجيات"]
  - id: payment
    question:
      en: "How do I pay for a consultation?"
      fr: "Comment payer une consultation ?"
      ar: "كيف أدفع ثمن الاستشارة؟"
    answer:
      en: "Payment is made at the admissions desk (Building A, ground floor) by card or cash. With your Carte Vitale, the part covered by health insurance is handled directly."
      fr: "Le paiement se fait au bureau des admissions (bâtiment A, rez-de-chaussée) par carte ou en espèces. Avec votre carte Vitale, la part prise en charge par l'Assurance Maladie est réglée directement."
      ar: "يتم الدفع في مكتب القبول (المبنى A، الطابق الأرضي) بالبطاقة أو نقدًا. مع بطاقة Carte Vitale، يتم التكفل مباشرة بالجزء الذي يغطيه التأمين الصحي."
    keywords: [pay, payment, price, cost, bill, payer, paiement, prix, "coût", tarif, facture, "دفع", "ثمن", "تكلفة", "فاتورة", "flous", "chhal"]
  - id: lost_property
    question:
      en: "I lost something at the hospital. What should I do?"
      fr: "J'ai perdu un objet à l'hôpital. Que faire ?"
      ar: "فقدت شيئًا في المستشفى. ماذا أفعل؟"
    answer:
      en: "Contact the reception desk; lost property is kept at the main entrance for 3 months."
      fr: "Contactez l'accueil ; les objets trouvés sont conservés à l'entrée principale pendant 3 mois."
      ar: "اتصل بمكتب الاستقبال؛ تُحفظ المفقودات عند المدخل الرئيسي لمدة 3 أشهر."
    keywords: [lost, lost property, forgot, "objet perdu", "objets trouvés", perdu, "مفقودات", "ضاع", "نسيت"]
