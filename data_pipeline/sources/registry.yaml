# Source registry: the single source of truth for what may be fetched and indexed.
# Schema: core/schemas/source.py (SourceRecord). Validated in CI by tests/data_pipeline/test_registry.py.
# Rules:
#   - status=active requires license.evidence_url + verified_on + verified_by, commercial_use yes|conditional.
#   - Anything not listed here, or listed as hold/excluded, can never be indexed.
#   - verified_by names who read the terms page ("data-agent" for automated reads, a person for manual review).
version: 1
sources:
  # ---------------- Wave 1 (verified commercial-safe) : filled in by the data track ----------------
  - id: medlineplus_topics
    name: MedlinePlus Health Topics
    publisher: U.S. National Library of Medicine
    homepage: https://medlineplus.gov/
    status: active
    wave: 1
    trust_tier: 1
    reuse_mode: paraphrase_ok
    languages: [en]   # Spanish topics exist in the file but Spanish is not a target language
    content_types: [condition, wellness]
    license:
      id: public-domain-us-gov
      name: Public domain (U.S. Government work); acknowledge MedlinePlus
      evidence_url: https://medlineplus.gov/about/using/usingcontent/
      commercial_use: yes
      attribution: "Source: MedlinePlus, National Library of Medicine"
      conditions:
        - "Public-domain scope per the page: homepage, summaries on health topic pages, medical test information, Genetics summaries, watermarked illustrations, recipes, videos, tutorials"
        - "Acknowledge MedlinePlus with 'Courtesy of MedlinePlus from the National Library of Medicine' or 'Source: MedlinePlus, National Library of Medicine'"
        - "A.D.A.M. Medical Encyclopedia and ASHP drug monographs are copyrighted: never ingest (medlineplus.gov/ency/, medlineplus.gov/druginfo/)"
        - "Images and photos may be copyrighted: images are never ingested"
        - "Do not use the NLM logo; do not frame or masquerade MedlinePlus URLs as another domain; RSS feeds are personal use only"
        - "xml.html: the XML files are offered for download and use; indicate that the information is from MedlinePlus.gov"
      verified_on: 2026-11-15
      verified_by: data-agent
    access:
      method: bulk
      endpoints: ["https://medlineplus.gov/xml.html"]
      notes: "robots.txt disallows /xml/ for generic crawlers, but xml.html explicitly publishes these files for download; only the dated file URLs listed on xml.html are fetched (robots override recorded in the fetch manifest)"
    refresh_days: 7
    domains: [medlineplus.gov]

