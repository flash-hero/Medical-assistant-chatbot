  - id: openfda_labels
    name: openFDA drug labels (SPL)
    publisher: U.S. Food and Drug Administration
    homepage: https://open.fda.gov/
    status: active
    wave: 1
    trust_tier: 1
    reuse_mode: paraphrase_ok
    languages: [en]
    content_types: [drug_label]
    license:
      id: CC0-1.0
      name: Public domain, CC0 1.0 Universal dedication (FDA openFDA Terms of Service)
      evidence_url: https://open.fda.gov/terms/
      commercial_use: yes
      attribution: "Data provided by the U.S. Food and Drug Administration (https://open.fda.gov)"
      conditions:
        - "Terms: content and data on openFDA are public domain under CC0 1.0 'unless otherwise noted'; commercial use allowed without permission"
        - "Attribution is requested, not required; the example citation is used as the attribution line"
        - "Works where CC0 does not apply are 'clearly marked by a warning'; the drug label download carries no such marking (download.json meta: disclaimer, terms, license only); documents containing 'not in the public domain' or 'third party copy rights may apply' are dropped"
        - "The GMDN Agency notice (no AI-training use without licence) applies to device GMDN term data only; no device data is fetched"
        - "openFDA data are unvalidated and must not be relied on for medical care decisions (download.json disclaimer): labels carry jurisdiction 'US FDA label'"
        - "Right to Limit: access may be restricted if limits are circumvented; downloads use the published bulk partitions at 1 request/second"
      verified_on: 2026-11-15
      verified_by: data-agent
    access:
      method: bulk
      endpoints: ["https://api.fda.gov/download.json"]
      notes: "14 zip partitions of drug label JSON (about 1.75 GB). download.open.fda.gov serves robots.txt as 403 (S3 bucket without a robots file), so the zip URLs, which are explicitly published in download.json, are fetched robots-exempt; the exemption is recorded in the fetch manifest."
    refresh_days: 7
    domains: [api.fda.gov, download.open.fda.gov, open.fda.gov, dailymed.nlm.nih.gov]

