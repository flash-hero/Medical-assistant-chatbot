  - {id: x_medlineplus_ashp, name: MedlinePlus drug monographs (ASHP), publisher: ASHP, homepage: https://medlineplus.gov/druginformation.html, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en, es], content_types: [drug_label], domains: [], notes: "medlineplus.gov/druginfo/meds/ paths", license: {id: proprietary, name: Licensed to NLM; not reusable, commercial_use: no}}
  - {id: x_medrag_textbooks, name: MedRAG/textbooks and MedRAG/statpearls datasets, publisher: Hugging Face community, homepage: https://huggingface.co/MedRAG, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en], content_types: [textbook], domains: [], license: {id: none, name: No licence / copyrighted textbooks, commercial_use: no}}

  # ---------------- Optional non-commercial profile (off by default) ----------------
  - {id: who_fact_sheets, name: WHO fact sheets, publisher: World Health Organization, homepage: https://www.who.int/news-room/fact-sheets, status: optional_noncommercial, wave: 3, trust_tier: 1, reuse_mode: paraphrase_ok, languages: [en, fr, ar], content_types: [condition], domains: [who.int], license: {id: CC-BY-NC-SA-3.0-IGO, name: CC BY-NC-SA 3.0 IGO, evidence_url: "https://www.who.int/about/policies/publishing/copyright", commercial_use: no, attribution: "Source: World Health Organization"}}
