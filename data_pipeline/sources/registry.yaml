  # ---------------- Wave 3: native French and Arabic (and English) encyclopaedic content ----------------
  - id: wikipedia_medicine
    name: Wikipedia medicine articles (English, French, Arabic)
    publisher: Wikimedia Foundation and Wikipedia contributors
    homepage: https://www.wikipedia.org/
    status: active
    wave: 3
    trust_tier: 3
    reuse_mode: paraphrase_ok
    languages: [en, fr, ar]
    content_types: [condition]
    license:
      id: CC-BY-SA-4.0
      name: Creative Commons Attribution-ShareAlike 4.0 International
      evidence_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      commercial_use: conditional
      attribution: "Source: Wikipedia, the free encyclopedia (CC BY-SA 4.0); authors are listed in each article's page history"
      conditions:
        - "Terms of Use section 7: text contributions are licensed CC BY-SA 4.0 (siteinfo rightsinfo of en/fr/ar.wikipedia.org returns https://creativecommons.org/licenses/by-sa/4.0/); commercial use is allowed"
        - "Attribution: a hyperlink to the article (its history page lists the authors) satisfies the credit requirement per Terms of Use section 7; every citation links to the article URL stored in the document"
        - "Share-alike: derivative text (verbatim excerpts, translations, close paraphrases) must be offered under CC BY-SA 4.0 with the same attribution; the app shows the licence name and link wherever such text appears"
        - "Text only: images, infobox data, tables and references are not ingested (images carry their own licences)"
        - "Trust tier 3: community-edited, flagged as lower trust than the government and institute sources; never the sole basis for a drug dose or a care decision"
        - "Wikimedia Robot policy (wikitech Robot_policy, Action API rules): descriptive User-Agent, one request at a time, at most 2 requests/second, maxlag on every call; robots.txt disallows /w/ for generic crawlers but the policy names api.php as the interface for bots, so API calls are robots-exempt (recorded in the fetch manifest)"
        - "Scope: English WikiProject Medicine Top- and High-importance articles plus the French and Arabic articles they link to"
      verified_on: 2026-11-16
      verified_by: data-agent
    access:
      method: api
      endpoints: ["https://en.wikipedia.org/w/api.php", "https://fr.wikipedia.org/w/api.php", "https://ar.wikipedia.org/w/api.php"]
      rate_limit_per_min: 120
      notes: "action=query: categorymembers of Category:Top-importance / High-importance medicine articles, langlinks (batches of 50), then prop=extracts|info|revisions|pageprops with explaintext and exsectionformat=wiki; disambiguation pages skipped; reference, external-link and see-also sections dropped"
    refresh_days: 90
    domains: [wikipedia.org]

