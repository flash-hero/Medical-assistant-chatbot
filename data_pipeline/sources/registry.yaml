# Source registry: the single source of truth for what may be fetched and indexed.
# Schema: core/schemas/source.py (SourceRecord). Validated in CI by tests/data_pipeline/test_registry.py.
# Rules:
#   - status=active requires license.evidence_url + verified_on + verified_by, commercial_use yes|conditional.
#   - Anything not listed here, or listed as hold/excluded, can never be indexed.
#   - verified_by names who read the terms page ("data-agent" for automated reads, a person for manual review).
version: 1
sources:
  # ---------------- Wave 1 (verified commercial-safe) : filled in by the data track ----------------
  - id: medlineplus_topics
    name: MedlinePlus Health Topics
    publisher: U.S. National Library of Medicine
    homepage: https://medlineplus.gov/
    status: hold   # data track: re-read terms, then set active with evidence
    wave: 1
    trust_tier: 1
    reuse_mode: paraphrase_ok
    languages: [en, es]
    content_types: [condition, wellness]
    license:
      id: public-domain-us-gov
      name: Public domain (U.S. Government work); credit MedlinePlus
      evidence_url: https://medlineplus.gov/about/using/usingcontent/
      commercial_use: yes
      attribution: "Source: MedlinePlus, U.S. National Library of Medicine"
      conditions: ["do not use the MedlinePlus logo", "do not imply NLM endorsement",
                   "A.D.A.M. encyclopedia and ASHP drug monographs are copyrighted and excluded"]
    access:
      method: bulk
      endpoints: ["https://medlineplus.gov/xml.html"]
    refresh_days: 7
    domains: [medlineplus.gov]

  # ---------------- Excluded (never fetched, never indexed) ----------------
  - {id: x_mayo_clinic, name: Mayo Clinic, publisher: Mayo Foundation, homepage: https://www.mayoclinic.org/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en], content_types: [condition], domains: [mayoclinic.org], license: {id: proprietary, name: "All rights reserved; terms prohibit scraping/reuse", commercial_use: no}}
  - {id: x_webmd, name: WebMD, publisher: WebMD LLC, homepage: https://www.webmd.com/, status: excluded, wave: 0, trust_tier: 3, reuse_mode: link_only, languages: [en], content_types: [condition], domains: [webmd.com], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_cleveland_clinic, name: Cleveland Clinic, publisher: Cleveland Clinic, homepage: https://my.clevelandclinic.org/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en], content_types: [condition], domains: [clevelandclinic.org], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_msd_manuals, name: Merck / MSD Manuals, publisher: Merck & Co., homepage: https://www.msdmanuals.com/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en, fr], content_types: [condition], domains: [msdmanuals.com, merckmanuals.com], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_uptodate, name: UpToDate, publisher: Wolters Kluwer, homepage: https://www.uptodate.com/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en], content_types: [guideline], domains: [uptodate.com], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_healthline, name: Healthline, publisher: Healthline Media, homepage: https://www.healthline.com/, status: excluded, wave: 0, trust_tier: 3, reuse_mode: link_only, languages: [en], content_types: [condition], domains: [healthline.com], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_drugs_com, name: Drugs.com, publisher: Drugsite Trust, homepage: https://www.drugs.com/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en], content_types: [drug_label], domains: [drugs.com], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_medscape, name: Medscape, publisher: WebMD LLC, homepage: https://www.medscape.com/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [en], content_types: [condition], domains: [medscape.com], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
  - {id: x_vidal, name: Vidal, publisher: Vidal Group, homepage: https://www.vidal.fr/, status: excluded, wave: 0, trust_tier: 2, reuse_mode: link_only, languages: [fr], content_types: [drug_label], domains: [vidal.fr], license: {id: proprietary, name: All rights reserved, commercial_use: no}}
