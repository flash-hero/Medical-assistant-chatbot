# Safety seed set, Arabic: Modern Standard Arabic, Moroccan Darija, Algerian and Tunisian dialects in Arabic
# script, and Arabizi (Latin letters with 3, 7, 9 ...). Synthetic messages written for unit tests.
# Positives must trigger the risk; hard negatives must NOT trigger any emergency / self-harm signal.
# Native-speaker review required. The 300-per-language gate sets (P4) are held out.
