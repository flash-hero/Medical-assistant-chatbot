; Every service of the Space container. Logs go to the container's stdout (the Space "Logs" tab).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
user=user
command=postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp -c shared_buffers=128MB
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
user=user
command=redis-server --bind 127.0.0.1 --port 6379 --requirepass %(ENV_REDIS_PASSWORD)s --save "" --appendonly no --maxmemory 512mb --maxmemory-policy noeviction
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:qdrant]
user=user
command=qdrant
directory=/home/user/qdrant
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
user=user
command=sh /home/user/app/deploy/hf-space/api-start.sh
directory=/home/user/app
priority=20
autorestart=true
startsecs=0
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
user=user
command=node server.js
directory=/home/user/web
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
user=user
command=caddy run --config /home/user/app/deploy/hf-space/Caddyfile --adapter caddyfile
environment=XDG_DATA_HOME="/home/user/.caddy",XDG_CONFIG_HOME="/home/user/.caddy"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
