# Production-like stack. Usage (from repo root):
#   cp deploy/.env.prod.example deploy/.env.prod   # fill secrets
#   docker compose -f deploy/compose.yaml --env-file deploy/.env.prod up -d --build
# Only Caddy is published; Qdrant, Postgres and Redis live on an internal network.
name: ausculta

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    networks: [edge]

  web:
    <<: *restart
    build: {context: .., dockerfile: deploy/web.Dockerfile}
    environment:
      API_ORIGIN: http://api:8000
    read_only: true
    tmpfs: ["/tmp"]
    networks: [edge]

  api:
    <<: *restart
    build: {context: .., dockerfile: deploy/api.Dockerfile}
    env_file: [.env.prod]
    environment:
      AUSCULTA_ENV: prod
      AUSCULTA_TRUSTED_PROXY_COUNT: "1"
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://ausculta:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ausculta
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [edge, internal]

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.20.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant_storage:/qdrant/storage, qdrant_snapshots:/qdrant/snapshots]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ausculta
      POSTGRES_USER: ausculta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ausculta -d ausculta"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  redis:
    <<: *restart
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--maxmemory", "256mb",
              "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

networks:
  edge: {}
  internal: {internal: true}

volumes:
  caddy_data: {}
  caddy_config: {}
  qdrant_storage: {}
  qdrant_snapshots: {}
  pg_data: {}
